<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 508" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Aider polyglot pass at 2 by language. Ornith-1.5-35B-A3B scores 35.3 percent on Python, 40.8 on JavaScript, 28.2 on Go, 34.6 on C++ and 27.7 on Java. Qwen3.8-Flash-Next scores 82.4, 81.6, 71.8, 69.2 and 66.0 on the same languages. Rust is omitted because the benchmark container has a broken cargo toolchain and both models score zero</title>
