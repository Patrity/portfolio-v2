<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Two panels on edit-format compliance. Top, across the full 225-exercise run: Ornith-1.5 returns a well-formed edit 62.7 percent of the time with 134 malformed and 37 truncated responses, while Qwen3.8-Flash-Next returns 96.4 percent well formed with 14 malformed and none truncated. Bottom, a 20-exercise probe on Ornith-1.5 alone: 40 percent well formed when asked for search-and-replace diffs, against 100 percent when asked to rewrite whole files</title>
<rect x="0.5" y="0.5" width="799" height="409" rx="14" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="28" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">The code was fine. The edits would not apply.</text>
<text x="28" y="63" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Share of responses that came back as a well-formed edit the harness could actually use</text>
<text x="28" y="98" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="start" style="letter-spacing:0.06em">THE SYMPTOM: FULL 225-EXERCISE RUN</text>
<text x="28" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Ornith-1.5</text>
<text x="772" y="124" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="end">134 malformed, 37 truncated</text>
<path d="M 28 132 H 448.08000000000004 Q 452.08000000000004 132 452.08000000000004 136 V 148 Q 452.08000000000004 152 448.08000000000004 152 H 28 Z" fill="#3987e5"/>
<text x="462.08000000000004" y="147" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric: tabular-nums">62.7%</text>
<text x="28" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Qwen3.8-Flash-Next</text>
<text x="772" y="176" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="end">14 malformed, 0 truncated</text>
<path d="M 28 184 H 676.0145454545454 Q 680.0145454545454 184 680.0145454545454 188 V 200 Q 680.0145454545454 204 676.0145454545454 204 H 28 Z" fill="#199e70"/>
<text x="690.0145454545454" y="199" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric: tabular-nums">96.4%</text>
<line x1="28.5" y1="108" x2="28.5" y2="204" stroke="#383835" stroke-width="1"/>
<line x1="28" y1="226" x2="772" y2="226" stroke="#2c2c2a" stroke-width="1"/>
<text x="28" y="258" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="start" style="letter-spacing:0.06em">THE CAUSE: ORNITH-1.5 ALONE, 20-EXERCISE FORMAT PROBE</text>
<text x="28" y="282" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Asked for search-and-replace diffs</text>
<path d="M 28 290 H 294.54545454545456 Q 298.54545454545456 290 298.54545454545456 294 V 306 Q 298.54545454545456 310 294.54545454545456 310 H 28 Z" fill="#3987e5"/>
<text x="308.54545454545456" y="305" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric: tabular-nums">40%</text>
<text x="28" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Asked to rewrite whole files</text>
<path d="M 28 342 H 700.3636363636364 Q 704.3636363636364 342 704.3636363636364 346 V 358 Q 704.3636363636364 362 700.3636363636364 362 H 28 Z" fill="#3987e5"/>
<text x="714.3636363636364" y="357" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric: tabular-nums">100%</text>
<line x1="28.5" y1="266" x2="28.5" y2="362" stroke="#383835" stroke-width="1"/>
<text x="28" y="388" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Two separate probes with different sample sizes, shown together because the second explains the first.</text>
</svg>
