<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Aggregate throughput running the same model on two RTX 3090s in tensor-parallel versus one RTX PRO 6000: 153.9 against 200.0 tokens per second at 1 concurrent request, 667.6 against 1049.2 at 8 concurrent, and 758.4 against 2072.3 at 32 concurrent</title>
<rect x="0.5" y="0.5" width="799" height="401" rx="14" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
