<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 444" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Two panels showing a reversal between the same two models. Top panel, decode speed: Ornith-1.5-35B-A3B reaches 143.8 tokens per second against 70 for Qwen3.8-Flash-Next. Bottom panel, Aider polyglot pass at 2 across 225 compiled and tested exercises: Ornith scores 28.9 percent against 64.4 percent for Qwen3.8-Flash-Next, a paired McNemar p value of 1.1 times ten to the negative seventeenth</title>
<rect x="0.5" y="0.5" width="799" height="443" rx="14" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<text x="28" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">The fast model lost the only test that ran the code</text>
<text x="28" y="63" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Same two models, same card. The top panel is why I picked the wrong one.</text>
<text x="28" y="98" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="start" style="letter-spacing:0.06em">DECODE SPEED, SINGLE STREAM AT 2.4K PROMPT TOKENS</text>
