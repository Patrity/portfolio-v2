<path d="M 28 306 H 331.1657142857143 Q 335.1657142857143 306 335.1657142857143 310 V 324 Q 335.1657142857143 328 331.1657142857143 328 H 28 Z" fill="#3987e5"/>
<text x="345.1657142857143" y="322" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric: tabular-nums">28.9%</text>
<text x="28" y="354" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">Qwen3.8-Flash-Next</text>
