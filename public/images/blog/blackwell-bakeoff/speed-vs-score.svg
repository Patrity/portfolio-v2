<text x="28" y="412" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Paired McNemar test on identical exercises: p = 1.1e-17. The two panels use separate scales.</text>
