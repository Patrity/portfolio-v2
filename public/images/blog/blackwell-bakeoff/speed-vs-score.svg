<text x="772" y="180" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#898781" text-anchor="end">2.1x faster</text>
<line x1="28" y1="238" x2="772" y2="238" stroke="#2c2c2a" stroke-width="1"/>
<text x="28" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#898781" text-anchor="start" style="letter-spacing:0.06em">AIDER POLYGLOT PASS@2, 225 EXERCISES, COMPILED AND TESTED</text>
<text x="772" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="end">percent solved</text>
