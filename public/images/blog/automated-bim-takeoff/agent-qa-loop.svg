<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 652" width="1200" height="652" role="img" aria-label="Sequence diagram: an extraction agent ships a cable schedule, a scheduling agent audits it and files a punch list of impossible mutual feed pairs, the extraction agent fixes the attribution bug and regenerates, and the scheduling agent rebuilds its imports">
<rect x="0.5" y="0.5" width="1199" height="651" rx="14" fill="#1a1a19" stroke="#33322f"/>
<text x="36" y="44" font-size="24" fill="#e8e6e1" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Agents doing QA on agents</text>
<text x="36" y="72" font-size="15" fill="#a8a59e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The cable schedule audit, as it actually ran (August 2026)</text>
<rect x="170" y="108" width="300" height="62" rx="10" fill="#1a1a19" stroke="#33322f"/>
<rect x="170" y="108" width="300" height="4" rx="2" fill="#3987e5"/>
<circle cx="194" cy="144" r="6" fill="#3987e5"/>
<text x="210" y="138" font-size="16" fill="#e8e6e1" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Extraction agent</text>
<text x="210" y="158" font-size="13" fill="#a8a59e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">builds deliverables from the models</text>
<rect x="730" y="108" width="300" height="62" rx="10" fill="#1a1a19" stroke="#33322f"/>
<rect x="730" y="108" width="300" height="4" rx="2" fill="#199e70"/>
<circle cx="754" cy="144" r="6" fill="#199e70"/>
<text x="770" y="138" font-size="16" fill="#e8e6e1" text-anchor="start" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Scheduling agent</text>
<text x="770" y="158" font-size="13" fill="#a8a59e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">consumes them downstream</text>
<line x1="320" y1="170" x2="320" y2="570" stroke="#33322f" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
<line x1="880" y1="170" x2="880" y2="570" stroke="#33322f" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>
<text x="600" y="208" font-size="14.5" fill="#e8e6e1" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, sans-serif">cable schedule + one-line diagrams</text>
<text x="600" y="227" font-size="12.5" fill="#a8a59e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, sans-serif">a deliverable nobody modeled.. derived from the extraction</text>
<line x1="320" y1="246" x2="868" y2="246" stroke="#3987e5" stroke-width="2"/>
<path d="M 876 246 l -10 -5 l 0 10 z" fill="#3987e5"/>
<circle cx="320" cy="246" r="4" fill="#3987e5"/>
<rect x="710" y="276" width="340" height="34" rx="17" fill="#1a1a19" stroke="#199e70" stroke-opacity="0.55"/>
<text x="880" y="298" font-size="13.5" fill="#a8a59e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, sans-serif">audits it against its own workstream</text>
<text x="600" y="328" font-size="14.5" fill="#e8e6e1" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, sans-serif">punch-list.md: 3 lineups where A feeds B and B feeds A</text>
<text x="600" y="347" font-size="12.5" fill="#a8a59e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, sans-serif">signature: a cable leg 20 to 50x the gear spacing, in reciprocal pairs</text>
<line x1="880" y1="366" x2="332" y2="366" stroke="#199e70" stroke-width="2"/>
<path d="M 324 366 l 10 -5 l 0 10 z" fill="#199e70"/>
<circle cx="880" cy="366" r="4" fill="#199e70"/>
<rect x="150" y="396" width="340" height="34" rx="17" fill="#1a1a19" stroke="#3987e5" stroke-opacity="0.55"/>
<text x="320" y="418" font-size="13.5" fill="#a8a59e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, sans-serif">confirms the loop-tail attribution bug, fixes it</text>
<text x="600" y="448" font-size="14.5" fill="#e8e6e1" text-anchor="middle" font-weight="600" font-family="system-ui, -apple-system, sans-serif">regenerated schedule + rebuilt CSVs</text>
<text x="600" y="467" font-size="12.5" fill="#a8a59e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, sans-serif">every punch item answered, section by section</text>
<line x1="320" y1="486" x2="868" y2="486" stroke="#3987e5" stroke-width="2"/>
<path d="M 876 486 l -10 -5 l 0 10 z" fill="#3987e5"/>
<circle cx="320" cy="486" r="4" fill="#3987e5"/>
<rect x="710" y="516" width="340" height="34" rx="17" fill="#1a1a19" stroke="#199e70" stroke-opacity="0.55"/>
<text x="880" y="538" font-size="13.5" fill="#a8a59e" text-anchor="middle" font-weight="400" font-family="system-ui, -apple-system, sans-serif">rebuilds its imports.. loop closed</text>
<text x="36" y="606" font-size="13" fill="#898781" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">A real exchange from the session logs: the punch list was a markdown file one agent wrote and the other answered, item by item.</text>
<text x="36" y="626" font-size="13" fill="#898781" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">The bug (loop-return home runs booked against the paired unit) shipped in v1. A human never had to be the one to find it.</text>
</svg>