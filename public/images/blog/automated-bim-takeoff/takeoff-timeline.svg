<text x="206" y="252" font-size="13.5" fill="#a8a59e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">from two sets</text>
<line x1="36" y1="268" x2="1164" y2="268" stroke="#33322f"/>
<text x="150" y="302" font-size="15" fill="#e8e6e1" text-anchor="end" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Structural steel</text>
