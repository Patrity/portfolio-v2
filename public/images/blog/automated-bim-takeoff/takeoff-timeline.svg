<text x="150" y="476" font-size="15" fill="#e8e6e1" text-anchor="end" font-weight="600" font-family="system-ui, -apple-system, sans-serif">Classification</text>
<line x1="176" y1="471" x2="1156" y2="471" stroke="#33322f"/>
<circle cx="688" cy="471" r="7" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="704" y="467" font-size="13.5" fill="#e8e6e1" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">every line mapped</text>
<text x="704" y="484" font-size="13.5" fill="#a8a59e" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">to CSI codes</text>
<text x="36" y="540" font-size="13" fill="#898781" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">* the model’s own six search sets never included the steel.. the agent found it by reading every file, not the rules.</text>
<text x="36" y="560" font-size="13" fill="#898781" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Every milestone is timestamped in the working session logs. A hardening pass the following week added durable keys and caught a 7.2% double-count.</text>
