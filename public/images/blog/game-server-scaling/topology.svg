<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Thundoria topology: the browser reaches the Nuxt web app over HTTPS and the game servers over WSS, while the world-server stays private and reachable only server-to-server inside the OVH box</title>
<rect x="0.5" y="0.5" width="799" height="399" rx="14" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<defs>
<marker id="ah-3987e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3987e5"/></marker>
<marker id="ah-898781" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/></marker>
</defs>
<text x="28" y="40" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ffffff" text-anchor="start">Two services face the internet. The third is unreachable on purpose.</text>
<text x="28" y="63" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Thundoria request topology · the browser never contacts the world-server</text>
<line x1="516" y1="92" x2="516" y2="340" stroke="#383835" stroke-width="1" stroke-dasharray="4 4"/>
<text x="504" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#898781" text-anchor="end" style="letter-spacing:0.06em">REACHABLE FROM THE INTERNET</text>
<text x="528" y="108" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#898781" text-anchor="start" style="letter-spacing:0.06em">PRIVATE · SERVER-TO-SERVER ONLY</text>
<rect x="28" y="182" width="150" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="#3987e5" stroke-width="1"/>
<rect x="28" y="182" width="3" height="56" rx="1.5" fill="#3987e5"/>
<text x="42" y="204" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Browser</text>
<text x="42" y="221" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">the only client</text>
<rect x="250" y="126" width="200" height="52" rx="8" fill="rgba(255,255,255,0.03)" stroke="#3987e5" stroke-width="1"/>
<rect x="250" y="126" width="3" height="52" rx="1.5" fill="#3987e5"/>
<text x="264" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">web · Nuxt</text>
<text x="264" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Railway · public HTTPS</text>
<rect x="250" y="196" width="200" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="#3987e5" stroke-width="1"/>
<rect x="250" y="196" width="3" height="48" rx="1.5" fill="#3987e5"/>
<text x="264" y="218" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">game-east-1</text>
<text x="264" y="235" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">OVH · public WSS</text>
<rect x="250" y="262" width="200" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="#3987e5" stroke-width="1"/>
<rect x="250" y="262" width="3" height="48" rx="1.5" fill="#3987e5"/>
<text x="264" y="284" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">game-east-2</text>
<text x="264" y="301" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">OVH · public WSS</text>
<rect x="568" y="158" width="190" height="56" rx="8" fill="rgba(255,255,255,0.03)" stroke="#898781" stroke-width="1"/>
<rect x="568" y="158" width="3" height="56" rx="1.5" fill="#898781"/>
