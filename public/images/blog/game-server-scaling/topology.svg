<text x="582" y="197" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">no public domain</text>
<rect x="568" y="254" width="190" height="48" rx="8" fill="rgba(255,255,255,0.03)" stroke="#898781" stroke-width="1"/>
<rect x="568" y="254" width="3" height="48" rx="1.5" fill="#898781"/>
<text x="582" y="276" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">redis</text>
<text x="582" y="293" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">node registry</text>
<line x1="178" y1="200" x2="246" y2="158" stroke="#3987e5" stroke-width="2" marker-end="url(#ah-3987e5)"/>
<text x="186" y="168" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">HTTPS</text>
<line x1="178" y1="216" x2="246" y2="218" stroke="#3987e5" stroke-width="2" marker-end="url(#ah-3987e5)"/>
<text x="198" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">WSS</text>
<line x1="178" y1="228" x2="246" y2="282" stroke="#3987e5" stroke-width="2" marker-end="url(#ah-3987e5)"/>
<line x1="450" y1="152" x2="564" y2="180" stroke="#898781" stroke-width="2" marker-end="url(#ah-898781)"/>
<line x1="450" y1="214" x2="564" y2="198" stroke="#898781" stroke-width="2" marker-end="url(#ah-898781)"/>
<line x1="450" y1="288" x2="564" y2="272" stroke="#898781" stroke-width="2" marker-end="url(#ah-898781)"/>
<text x="28" y="368" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">Game nodes self-register in Redis with a 15s TTL and heartbeat every 5s, so a crashed node expires out of the fleet on its own.</text>
</svg>
